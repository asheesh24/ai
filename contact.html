<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contact</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

    <nav class="navbar">

        <div class="logo">AI Fault Diagnosis</div>

        <ul class="nav-links">

            <li><a href="index.html">Home</a></li>

            <li><a href="about.html">About</a></li>

            <li><a href="diagnosis.html">Diagnosis</a></li>

            <li>
                <a href="contact.html" class="active">
                    Contact
                </a>
            </li>

        </ul>

    </nav>

</header>

<section class="page-header">

    <h1>Contact</h1>

    <p>Project information and feedback</p>

</section>

<section class="diagnosis-container">

    <div class="diagnosis-card">

        <h2>Send Your Message</h2>

        <form onsubmit="submitForm(event)">

            <label>Name</label>

            <input
                type="text"
                id="name"
                required
                style="width:100%; padding:15px; margin:10px 0 20px;"
            >

            <label>Email</label>

            <input
                type="email"
                id="email"
                required
                style="width:100%; padding:15px; margin:10px 0 20px;"
            >

            <label>Message</label>

            <textarea
                id="message"
                required
                rows="6"
                style="width:100%; padding:15px; margin:10px 0 20px;"
            ></textarea>

            <button type="submit">
                Submit
            </button>

        </form>

        <div id="contactResult"></div>

    </div>

</section>

<footer>
    <p>© 2026 AI Fault Diagnosis Project</p>
</footer>

<script>

function submitForm(event) {

    event.preventDefault();

    document.getElementById("contactResult").innerHTML =
        "<div class='result success'>" +
        "<h3>Message Submitted!</h3>" +
        "<p>Thank you for your feedback.</p>" +
        "</div>";

}

</script>

</body>
</html>
